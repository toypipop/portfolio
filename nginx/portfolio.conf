server {
    listen 80;
    server_name portfolio.getpipop.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portfolio.getpipop.org;

    ssl_certificate /etc/letsencrypt/live/pay-app-uat.getpipop.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay-app-uat.getpipop.org/privkey.pem;

    location / {
        proxy_pass http://portfolio:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
