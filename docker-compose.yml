services:
  portfolio:
    build: .
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/portfolio.conf:/etc/nginx/conf.d/portfolio.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - portfolio
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    driver: bridge
